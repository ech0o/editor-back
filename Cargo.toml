[package]
name = "editor-back"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

bollard = "0.21"

anyhow = "1"
thiserror = "2"

uuid = { version = "1", features = ["v4"] }

futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"