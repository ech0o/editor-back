[package]
name = "editor-back"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

bollard = "0.21"

anyhow = "1"
thiserror = "2"

uuid = { version = "1", features = ["v4","serde"] }

futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"
tower-http = { version="0.7.0" ,features = ["limit","cors"] }
tower = "0.5.3"
rdkafka = "0.38"
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "postgres",
    "uuid",
] }
dotenvy = "0.15.7"
dotenvy_macro = "0.15.7"
tokio-util = "0.7.19"
prometheus = "0.14.0"