services:
  kafka:
    image: apache/kafka:4.1.1
    container_name: judge-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      # 使用 Kafka 自带的 cluster-id 或 api-versions 工具探测 9092 端口服务状态
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-cluster.sh cluster-id --bootstrap-server localhost:9092 || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
  db:
    image: postgres
    restart: always
    # set shared memory limit when using docker compose
    shm_size: 128mb
    # or set shared memory limit when deploy via swarm stack
    #volumes:
    #  - type: tmpfs
    #    target: /dev/shm
    #    tmpfs:
    #      size: 134217728 # 128*2^20 bytes = 128Mb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: example
    healthcheck:
      # 使用 pg_isready 检查数据库是否能够正常接受连接
      test: [ "CMD-SHELL", "pg_isready -U postgres -d postgres" ]
      interval: 5s       # 每 5 秒检查一次
      timeout: 5s        # 每次检查超时时间
      retries: 5         # 连续失败 5 次判定为 unhealthy
      start_period: 10s  # 容器启动后给 10 秒缓冲区才开始健康检查

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080

  prometheus:
    image: prom/prometheus:latest
    user: "0"
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock

  worker:
    build:
      context: .
      dockerfile: Dockerfile
#    entrypoint: /bin/sh
#    stdin_open: true
#    tty: true
    command: ["worker"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./workspaces:/workspaces
    environment:
#      WORKER_ID: "1"
      KAFKA_BROKERS: "kafka:9092"
      DATABASE_URL: "postgres://postgres:example@db:5432/postgres"
      WORKSPACE_HOST_ROOT: "${PWD}/workspaces"
    depends_on:
      kafka:
        condition: service_healthy
      db:
        condition: service_healthy
    expose:
      - "9091"
#    deploy:
#      replicas: 3
    stop_grace_period: 30s
  server:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: /usr/local/bin/editor-back
    #    stdin_open: true
    #    tty: true
#    command: [ ]
    ports:
      - 4000:4000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      KAFKA_BROKERS: "kafka:9092"
      DATABASE_URL: "postgres://postgres:example@db:5432/postgres"
    depends_on:
      kafka:
        condition: service_healthy
      db:
        condition: service_healthy

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
volumes:
  grafana_data: